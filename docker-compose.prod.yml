services:
  app:
    build:
      context: back
      target: prod
      dockerfile: Dockerfile
    ports:
      - "8222:8080"
    volumes:
      - ./back/app.db:/app/app.db
    env_file:
      - ./back/.env.prod
    restart: unless-stopped
    container_name: a01-back

