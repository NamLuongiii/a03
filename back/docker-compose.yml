version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis_server
    restart: always
    ports:
      - "6379:6379"  # Expose để dev (Golang ngoài Docker) connect được
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - web_network

  backend:
    build: .
    container_name: backend_app  # Đặt tên cố định cho dễ nhận diện
    restart: always
    env_file:
      - .env  # Docker Compose sẽ đọc file .env ở ngoài rồi truyền vào cho App
    expose:
      - "8080"
    networks:
      - web_network
    depends_on:
      - redis

  caddy:
    image: caddy:latest
    container_name: caddy_server
    restart: always
    ports:
      - "80:80"
      - "443:443"
    # Dùng tên container_name để Caddy tìm cho chính xác
    command: caddy reverse-proxy --from api.docluon.com --to backend_app:8080
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web_network

networks:
  web_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  redis_data: