basePath: /api/v1
definitions:
  dtos.RequestChangePassword:
    properties:
      email:
        type: string
    type: object
  dtos.ResetPassword:
    properties:
      email:
        type: string
      new_password:
        type: string
      token:
        type: string
    type: object
  dtos.VerifyOTP:
    properties:
      email:
        type: string
      otp:
        type: string
    type: object
  models.Account:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      profile:
        $ref: '#/definitions/models.Profile'
      updated_at:
        type: string
    type: object
  models.Author:
    properties:
      country:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      summary:
        type: string
      updated_at:
        type: string
    type: object
  models.Book:
    properties:
      author:
        $ref: '#/definitions/models.Author'
      author_id:
        type: string
      category:
        allOf:
        - $ref: '#/definitions/models.Category'
        description: Relationships
      category_id:
        type: string
      cover:
        $ref: '#/definitions/models.Image'
      cover_id:
        type: integer
      created_at:
        type: string
      created_by:
        type: integer
      creator:
        $ref: '#/definitions/models.Account'
      description:
        type: string
      download_nums:
        type: integer
      id:
        type: string
      is_hidden:
        type: boolean
      name:
        type: string
      rating_avg:
        type: number
      rating_count:
        type: integer
      series:
        $ref: '#/definitions/models.BookSeries'
      series_id:
        type: string
      summary:
        type: string
      updated_at:
        type: string
      view_nums:
        type: integer
    type: object
  models.BookSeries:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.Category:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.Image:
    properties:
      id:
        type: integer
      md:
        type: string
      sm:
        type: string
      xs:
        type: string
    type: object
  models.Profile:
    properties:
      account_id:
        type: integer
      avatar:
        type: string
      bio:
        type: string
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: integer
      updated_at:
        type: string
    type: object
  types.CommonResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  types.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  types.SignUpDto:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - email
    - name
    - password
    type: object
info:
  contact: {}
  title: My API
  version: "1.0"
paths:
  /auth/ask-reset-password:
    post:
      parameters:
      - description: email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.RequestChangePassword'
      responses: {}
      summary: send otp to email ask change password
      tags:
      - auth
  /auth/login:
    post:
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/types.LoginRequest'
      responses: {}
      summary: Login user by name
      tags:
      - auth
  /auth/me:
    get:
      responses: {}
      security:
      - BearerAuth: []
      summary: Get current user info
      tags:
      - auth
  /auth/reset-password:
    post:
      parameters:
      - description: new password
        in: body
        name: reset-password
        required: true
        schema:
          $ref: '#/definitions/dtos.ResetPassword'
      responses: {}
      summary: change password with the singed token
      tags:
      - auth
  /auth/signup:
    post:
      parameters:
      - description: user info
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/types.SignUpDto'
      responses:
        "200":
          description: Thành công
          schema:
            allOf:
            - $ref: '#/definitions/types.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Account'
              type: object
      summary: create a user
      tags:
      - auth
  /auth/verify-OTP:
    post:
      parameters:
      - description: OTP code
        in: body
        name: verifyOTP
        required: true
        schema:
          $ref: '#/definitions/dtos.VerifyOTP'
      responses: {}
      summary: Verify OTP
      tags:
      - auth
  /books:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Book'
            type: array
      summary: Get all books
      tags:
      - books
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Book name
        in: formData
        name: name
        required: true
        type: string
      - description: Description
        in: formData
        name: description
        type: string
      - description: Summary
        in: formData
        name: summary
        type: string
      - description: Category ID
        in: formData
        name: category_id
        type: string
      - description: Author ID
        in: formData
        name: author_id
        type: string
      - description: Cover image
        in: formData
        name: cover
        type: file
      - collectionFormat: csv
        description: Digital book files
        in: formData
        items:
          type: file
        name: files
        type: array
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/types.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Book'
              type: object
      security:
      - BearerAuth: []
      summary: Create a new book
      tags:
      - books
  /books/{bookID}/comments:
    post:
      responses: {}
      summary: Add a comment to a book
      tags:
      - books
  /books/{bookID}/ratings:
    post:
      responses: {}
      summary: Add a rating to a book
      tags:
      - books
  /books/{bookId}/get-by-series:
    get:
      responses: {}
      summary: Get books in a series
      tags:
      - books
  /books/{id}:
    get:
      parameters:
      - description: Book ID
        in: path
        name: id
        required: true
        type: integer
      responses: {}
      summary: Get a book by ID
      tags:
      - books
  /books/authors/{authorID}:
    get:
      responses: {}
      summary: Get all authors
      tags:
      - books
  /books/categories:
    get:
      responses: {}
      summary: Get all categories
      tags:
      - books
  /books/featured:
    get:
      responses: {}
      summary: Get featured books
      tags:
      - books
  /books/popular:
    get:
      responses: {}
      summary: Get popular books
      tags:
      - books
  /processor:
    post:
      parameters:
      - description: Image to process
        in: formData
        name: cover
        required: true
        type: file
      responses: {}
      summary: image processing flow
      tags:
      - processor
securityDefinitions:
  BearerAuth:
    description: Type only token (not include Bearer)
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
