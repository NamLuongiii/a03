      title:
        type: string
    type: object
  dto.RequestChangePassword:
    properties:
      email:
        type: string
    type: object
  dto.ResetPassword:
    properties:
      email:
        type: string
      new_password:
        type: string
      token:
        type: string
    type: object
  dto.VerifyOTP:
    properties:
      email:
        type: string
      otp:
        type: string
    type: object
  handlers.UserBookParams:
    properties:
