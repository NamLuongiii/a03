        in: path
        name: id
        required: true
        type: string
      - description: Book name
        in: formData
        name: name
        type: string
      - description: Book cover
        in: formData
        name: cover
        type: file
      - collectionFormat: csv
        description: Book files
        in: formData
        items:
          type: file
        name: files
        type: array
      - description: Book category
        in: formData
        name: category_id
        type: string
      - description: Book authors
        in: formData
        name: author_id
        type: string
      - collectionFormat: csv
        description: File IDs to remove
        in: formData
