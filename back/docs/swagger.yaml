        in: formData
        name: name
        required: true
        type: string
      - description: Book cover
        in: formData
        name: cover
        type: file
      - collectionFormat: csv
        description: Book files
        in: formData
        items:
          type: file
        name: files
        type: array
      - description: Book description
        in: formData
        name: description
        type: string
      - description: Book summary
        in: formData
        name: summary
        type: string
      - description: Book category
        in: formData
        name: category_id
        type: string
      - description: Book authors
        in: formData
        name: author_id
        type: string
      - description: file to unzip services
        in: formData
        name: readingFile
        type: file
      - description: 'Auto find services file in file list: 1 / 0'
