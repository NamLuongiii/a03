      size:
        type: integer
      total:
        type: integer
    type: object
  types.SignUpDto:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - email
    - name
    - password
    type: object
info:
  contact: {}
  title: My API
  version: "1.0"
paths:
  /auth/login:
    post:
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/types.LoginRequest'
      responses:
        "200":
          description: Thành công
          schema:
            allOf:
            - $ref: '#/definitions/types.CommonResponse'
            - properties:
                data:
                  type: string
              type: object
      summary: Login user by name
      tags:
      - auth
  /auth/me:
    get:
      responses:
        "200":
          description: Thành công
          schema:
            allOf:
            - $ref: '#/definitions/types.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Account'
              type: object
      security:
      - BearerAuth: []
      summary: Get current user info
      tags:
      - auth
  /auth/request-change-password:
    post:
      parameters:
      - description: RequestChangePassword
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RequestChangePassword'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.CommonResponse'
      summary: Initiate a password change
      tags:
      - auth
  /auth/reset-password:
    post:
      parameters:
      - description: ResetPassword
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPassword'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.CommonResponse'
      summary: Reset Password
      tags:
      - auth
  /auth/signup:
    post:
      parameters:
      - description: user info
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/types.SignUpDto'
      responses:
        "200":
          description: Thành công
          schema:
            allOf:
            - $ref: '#/definitions/types.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Account'
              type: object
      summary: create a user
      tags:
      - auth
  /auth/verify-otp:
    post:
      parameters:
      - description: VerifyOTP
        in: body
        name: body
        required: true
