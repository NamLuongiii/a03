      role:
        type: string
      updated_at:
        type: string
      user_books:
        description: Relations
        items:
          $ref: '#/definitions/models.UserBook'
        type: array
    type: object
  models.Author:
    properties:
      country:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      summary:
        type: string
      updated_at:
        type: string
    type: object
  models.Book:
    properties:
      author:
        $ref: '#/definitions/models.Author'
      author_id:
        type: string
      category:
        allOf:
        - $ref: '#/definitions/models.Category'
        description: Relationships
      category_id:
        type: string
      cover:
        $ref: '#/definitions/models.Image'
      cover_id:
        type: integer
      created_at:
        type: string
      created_by:
        type: integer
      creator:
        $ref: '#/definitions/models.Account'
      description:
        type: string
      digital_books:
        items:
          $ref: '#/definitions/models.DigitalBook'
        type: array
      download_nums:
        type: integer
      id:
        type: string
      is_hidden:
        type: boolean
      name:
        type: string
      rating_avg:
        type: number
      rating_count:
        type: integer
      series:
        $ref: '#/definitions/models.BookSeries'
      series_id:
        type: string
      summary:
        type: string
      unzip_root_url:
        type: string
      updated_at:
        type: string
      user_books:
        items:
          $ref: '#/definitions/models.UserBook'
        type: array
      view_nums:
        type: integer
    type: object
  models.BookRating:
    properties:
      account:
        $ref: '#/definitions/models.Account'
      account_id:
        type: integer
      book:
        allOf:
        - $ref: '#/definitions/models.Book'
        description: Relationships
      book_id:
        type: string
      created_at:
        type: string
      id:
        type: integer
      rating:
        type: integer
      updated_at:
        type: string
    type: object
  models.BookSeries:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.Category:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.Comment:
    properties:
      account:
        $ref: '#/definitions/models.Account'
      account_id:
        type: integer
      book:
        allOf:
        - $ref: '#/definitions/models.Book'
        description: Relationships
      book_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.DigitalBook:
    properties:
      book:
        allOf:
        - $ref: '#/definitions/models.Book'
