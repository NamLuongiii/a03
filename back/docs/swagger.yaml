        name: remove_file_ids
        type: array
      - description: Book description
        in: formData
        name: description
        type: string
      - description: Book summary
        in: formData
        name: summary
        type: string
      - description: file to unzip services
        in: formData
        name: readingFile
        type: file
      - description: 'Auto find services file in file list: 1 / 0'
        in: formData
        name: autoFindReadingFile
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/types.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Book'
              type: object
      security:
      - BearerAuth: []
