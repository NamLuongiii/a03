basePath: /api/v1
definitions:
  dtos.RequestChangePassword:
    properties:
      email:
        type: string
    type: object
  dtos.ResetPassword:
    properties:
      email:
        type: string
      new_password:
        type: string
      token:
        type: string
    type: object
  dtos.VerifyOTP:
    properties:
      email:
        type: string
      otp:
        type: string
    type: object
  models.Account:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      profiles:
        items:
          $ref: '#/definitions/models.Profile'
        type: array
    type: object
  models.Activity:
    properties:
      earned_stars:
        type: integer
      id:
        type: integer
      lesson_name:
        type: string
      log_at:
        type: string
      profile_id:
        type: integer
      result:
        type: string
    type: object
  models.Profile:
    properties:
      account_id:
        type: integer
      activities:
        items:
          $ref: '#/definitions/models.Activity'
        type: array
      birth_year:
        type: integer
      id:
        type: integer
      name:
        type: string
      stars:
        type: integer
    type: object
  types.ActivityDto:
    properties:
      earned_stars:
        type: integer
      lesson_name:
        type: string
      result:
        type: string
    type: object
  types.CommonResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  types.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  types.ProfileDto:
    properties:
      birth_year:
        type: integer
      name:
        type: string
    type: object
  types.SignUpDto:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - email
    - name
    - password
    type: object
info:
  contact: {}
  title: My API
  version: "1.0"
paths:
  /auth/ask-reset-password:
    post:
      parameters:
      - description: email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.RequestChangePassword'
      responses: {}
      summary: send otp to email ask change password
      tags:
      - auth
  /auth/login:
    post:
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/types.LoginRequest'
      responses: {}
      summary: Login user by name
      tags:
      - auth
  /auth/me:
    get:
      responses: {}
      security:
      - BearerAuth: []
      summary: Get current user info
      tags:
      - auth
  /auth/reset-password:
    post:
      parameters:
      - description: new password
        in: body
        name: reset-password
        required: true
        schema:
          $ref: '#/definitions/dtos.ResetPassword'
      responses: {}
      summary: change password with the singed token
      tags:
      - auth
  /auth/signup:
    post:
      parameters:
      - description: user info
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/types.SignUpDto'
      responses:
        "200":
          description: Thành công
          schema:
            allOf:
            - $ref: '#/definitions/types.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Account'
              type: object
      summary: create a user
      tags:
      - auth
  /auth/verify-OTP:
    post:
      parameters:
      - description: OTP code
        in: body
        name: verifyOTP
        required: true
        schema:
          $ref: '#/definitions/dtos.VerifyOTP'
      responses: {}
      summary: Verify OTP
      tags:
      - auth
  /profiles:
    get:
      responses: {}
      security:
      - BearerAuth: []
      summary: Get account profiles
      tags:
      - Profile
    post:
      parameters:
      - description: Profile dto
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/types.ProfileDto'
      responses: {}
      security:
      - BearerAuth: []
      summary: Create a new profile
      tags:
      - Profile
  /profiles/{id}:
    delete:
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: integer
      responses: {}
      security:
      - BearerAuth: []
      summary: Delete profile
      tags:
      - Profile
    put:
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: integer
      - description: Profile dto
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/types.ProfileDto'
      responses: {}
      security:
      - BearerAuth: []
      summary: Update profile
      tags:
      - Profile
  /profiles/{id}/activities:
    get:
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: integer
      responses: {}
      security:
      - BearerAuth: []
      summary: Get activities of a profile
      tags:
      - Profile
    post:
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: integer
      - description: Activity dto
        in: body
        name: activity
        required: true
        schema:
          $ref: '#/definitions/types.ActivityDto'
      responses: {}
      security:
      - BearerAuth: []
      summary: Save activity of a profile
      tags:
      - Profile
securityDefinitions:
  BearerAuth:
    description: Type only token (not include Bearer)
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
